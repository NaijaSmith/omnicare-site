spring.application.name=omnicare-backend
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/omnicare_db?useSSL=false&serverTimezone=UTC
    username: root
    password: YOUR_SECURE_XAMPP_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379